[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "adres-tr"
dynamic = ["version"]
description = "Split free-form Turkish addresses into province, district, neighbourhood, street, building number, floor and flat. Official list of 81 provinces and 973 districts with postal ranges, no dependencies."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [
    { name = "Arda Zeybek", email = "179981861+ardazeybek-dev@users.noreply.github.com" },
]
keywords = ["turkish", "turkey", "address", "adres", "address parser", "il", "ilce", "mahalle", "postal code", "posta kodu"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Natural Language :: Turkish",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.urls]
Homepage = "https://github.com/ardazeybek-dev/adres"
Repository = "https://github.com/ardazeybek-dev/adres"
Issues = "https://github.com/ardazeybek-dev/adres/issues"

[project.scripts]
adres = "adres.cli:main"

[tool.hatch.version]
path = "src/adres/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/adres"]

[tool.hatch.build.targets.sdist]
include = ["src/adres", "tests", "scripts", "README.md", "LICENSE"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.pytest.ini_options]
testpaths = ["tests", "src"]
pythonpath = ["tests"]
addopts = "-q --doctest-modules --import-mode=importlib"
